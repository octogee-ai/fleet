name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'main.go', 'go.mod']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Build
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="v0.0.0-dryrun.${GITHUB_SHA::12}"
          fi
          mkdir dist
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              name="octogee-fleet_${version}_${os}_${arch}"
              binary=octogee-fleet
              if [ "$os" = windows ]; then binary=octogee-fleet.exe; fi
              mkdir "dist/$name"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=$version" -o "dist/$name/$binary" .
              cp LICENSE README.md "dist/$name/"
              if [ "$os" = windows ]; then
                (cd dist && zip -qr "$name.zip" "$name")
              else
                tar -C dist -czf "dist/$name.tar.gz" "$name"
              fi
            done
          done
          host="$(go env GOOS)_$(go env GOARCH)"
          reported="$("dist/octogee-fleet_${version}_${host}/octogee-fleet" --version)"
          if [ "$reported" != "$version" ]; then
            echo "::error::the ${host} build reports ${reported}, not ${version}"
            exit 1
          fi
          cd dist
          sha256sum octogee-fleet_*.tar.gz octogee-fleet_*.zip > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: |
            dist/octogee-fleet_*.tar.gz
            dist/octogee-fleet_*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
          path: dist
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/octogee-fleet_*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/octogee-fleet_* dist/checksums.txt --verify-tag --title "$TAG" --generate-notes
