name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              name="octogee-fleet_${TAG}_${os}_${arch}"
              mkdir "dist/$name"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=$TAG" -o "dist/$name/octogee-fleet" .
              cp LICENSE README.md "dist/$name/"
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            done
          done
          cd dist
          sha256sum octogee-fleet_*.tar.gz > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/octogee-fleet_*.tar.gz dist/checksums.txt --verify-tag --title "$TAG" --generate-notes
